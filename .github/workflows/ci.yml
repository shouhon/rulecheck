name: 検証とリリース

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  check:
    name: Windowsで必須検証
    runs-on: windows-latest
    timeout-minutes: 20
    outputs:
      changed: ${{ steps.version.outputs.changed }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: ソースを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Goを準備
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: 書式・静的検査・テスト・ビルドを確認
        run: ./scripts/check.ps1
      - name: push前後の版番号を比較
        id: version
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          $release = ./scripts/get-release-info.ps1 -Before $env:BEFORE -Commit $env:GITHUB_SHA
          "changed=$($release.Changed.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "version=$($release.Version)" >> $env:GITHUB_OUTPUT

  release:
    name: 新しい版を公開
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check.outputs.changed == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.check.outputs.version }}
      cancel-in-progress: false
    steps:
      - name: 検証したソースを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Goを準備
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Windows x64の配布物を生成
        run: ./scripts/package.ps1
      - name: 添付ファイルを照合してReleaseを公開
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.check.outputs.version }}
        run: ./scripts/publish-release.ps1 -Version $env:RELEASE_VERSION -Commit $env:GITHUB_SHA -Repository $env:GITHUB_REPOSITORY
